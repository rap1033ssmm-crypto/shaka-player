<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMKO AIRSPACE RADAR // MUSKOGEE COUNTY TERMINAL</title>
    <!-- High-Velocity Map Rendering Engine Core -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0a0c; color: #00ffcc; font-family: 'Courier New', monospace; height: 100vh; overflow: hidden; display: flex; }
        #radar-container { flex: 1; height: 100%; position: relative; }
        #teleprinter-panel { width: 380px; height: 100%; background: #111115; border-left: 2px solid #22222b; display: flex; flex-direction: column; }
        #header { padding: 15px; border-bottom: 2px solid #22222b; background: #0e0e12; }
        #header h1 { font-size: 16px; letter-spacing: 1px; color: #fff; text-transform: uppercase; }
        #header p { font-size: 11px; color: #888; margin-top: 4px; }
        #ticker-box { flex: 1; overflow-y: auto; padding: 15px; font-size: 12px; line-height: 1.6; }
        .flight-line { border-bottom: 1px solid #1c1c24; padding: 6px 0; display: flex; flex-direction: column; }
        .flight-line span { color: #ffaa00; }
        /* Map Custom Overrides for Dark-Mode */
        .leaflet-container { background: #0a0a0c !important; }
    </style>
</head>
<body>

    <!-- Radar Canvas Viewport -->
    <div id="radar-container"></div>

    <!-- Right Side Teleprinter Data Stream Panel -->
    <div id="teleprinter-panel">
        <div id="header">
            <h1>KMKO Airspace Monitor</h1>
            <p>Node WLT-LAND-OK-5111 // Muskogee County</p>
        </div>
        <div id="ticker-box" id="teleprinter-stream">
            <div class="flight-line">> System Initialized... Waiting for telemetry link.</div>
        </div>
    </div>

    <script>
        // Initialize the Radar Map centered over Muskogee County
const map = L.map('radar-container', {
    zoomControl: false,
    attributionControl: false
}).setView([35.6132, -95.3858], 11);

// Inject professional dark-mode map tile layouts
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18
}).addTo(map);

// Add a neon indicator tracking anchor right over Muskogee
const baseAnchor = L.circleMarker([35.6132, -95.3858], {
    color: '#00ffcc',
    radius: 6,
    weight: 2,
    fillColor: '#00ffcc',
    fillOpacity: 0.8
}).addTo(map);
baseAnchor.bindPopup("<b>NODE WLT-LAND-OK-5111</b><br>Muskogee, OK").openPopup();

console.log("System Status: Map engine pinned to Muskogee County coordinates.");

        // Step 3: Open Data Loop - Fetching live aviation telemetry over Muskogee County
let flightMarkers = {};
const teleprinterStream = document.getElementById('ticker-box');

async function fetchMuskogeeAirspace() {
    try {
        // Direct un-throttled open access stream centered over Muskogee County coordinates
        const response = await fetch('https://flight-radar-api.pages.dev/api/airspace?lat=35.6132&lon=-95.3858&rad=50');
        if (!response.ok) return;
        const data = await response.json();
        
        if (data && data.ac) {
            teleprinterStream.innerHTML = ''; // Clear stale ticker lines inside volatile RAM
            
            data.ac.forEach(aircraft => {
                // Verify valid latitude and longitude coordinates exist
                if (aircraft.lat && aircraft.lon) {
                    const id = aircraft.hex;
                    const callsign = aircraft.flight ? aircraft.flight.trim() : 'UNKNOWN';
                    const altitude = aircraft.alt_baro ? aircraft.alt_baro + ' ft' : 'GROUND';
                    const speed = aircraft.gs ? Math.round(aircraft.gs) + ' knots' : '0 kts';
                    
                    // Render or update the visual marker node on the map canvas
                    if (flightMarkers[id]) {
                        flightMarkers[id].setLatLng([aircraft.lat, aircraft.lon]);
                    } else {
                        flightMarkers[id] = L.circleMarker([aircraft.lat, aircraft.lon], {
                            color: '#ffaa00',
                            radius: 5,
                            weight: 2,
                            fillColor: '#ffaa00',
                            fillOpacity: 0.8
                        }).addTo(map);
                    }
                    
                    flightMarkers[id].bindPopup(`<b>Flight: ${callsign}</b><br>Alt: ${altitude}<br>Spd: ${speed}`);
                    
                    // Stream the live string telemetry directly down the teleprinter column
                    const logLine = document.createElement('div');
                    logLine.className = 'flight-line';
                    logLine.innerHTML = `> REG: <span>${id.toUpperCase()}</span> | CALL: <span>${callsign}</span><br>ALT: ${altitude} | SPD: ${speed}`;
                    teleprinterStream.appendChild(logLine);
                }
            });
        }
    } catch (error) {
        console.log("Telemetry Sync Hold... Reconnecting path.");
    }
}

// Fire the ingestion loop immediately, and refresh every 2.5 seconds
fetchMuskogeeAirspace();
setInterval(fetchMuskogeeAirspace, 2500);

    </script>
</body>
</html>
