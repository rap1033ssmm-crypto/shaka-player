<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMKO AIRSPACE RADAR // MUSKOGEE COUNTY TERMINAL</title>
    <!-- High-Velocity Map Rendering Engine Core -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0a0c; color: #00ffcc; font-family: 'Courier New', monospace; height: 100vh; overflow: hidden; display: flex; }
        #radar-container { flex: 1; height: 100%; position: relative; }
        #teleprinter-panel { width: 380px; height: 100%; background: #111115; border-left: 2px solid #22222b; display: flex; flex-direction: column; }
        #header { padding: 15px; border-bottom: 2px solid #22222b; background: #0e0e12; }
        #header h1 { font-size: 16px; letter-spacing: 1px; color: #fff; text-transform: uppercase; }
        #header p { font-size: 11px; color: #888; margin-top: 4px; }
        #ticker-box { flex: 1; overflow-y: auto; padding: 15px; font-size: 12px; line-height: 1.6; }
        .flight-line { border-bottom: 1px solid #1c1c24; padding: 6px 0; display: flex; flex-direction: column; }
        .flight-line span { color: #ffaa00; }
        .leaflet-container { background: #0a0a0c !important; }
    </style>
</head>
<body>

    <!-- Radar Canvas Viewport -->
    <div id="radar-container"></div>

    <!-- Right Side Teleprinter Data Stream Panel -->
    <div id="teleprinter-panel">
        <div id="header">
            <h1>KMKO Airspace Monitor</h1>
            <p>Node WLT-LAND-OK-5111 // Muskogee County</p>
        </div>
        <div id="ticker-box">
            <div class="flight-line">> System Initialized... Synchronizing Telemetry Matrix...</div>
        </div>
    </div>

    <script>
        // Initialize Map centered right over Muskogee, OK
        const map = L.map('radar-container', {
            zoomControl: false,
            attributionControl: false
        }).setView([35.6132, -95.3858], 9);

        // Load 100% unrestricted open map tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        // Add bright anchor over downtown Muskogee
        const baseAnchor = L.circleMarker([35.6132, -95.3858], {
            color: '#00ffcc',
            radius: 6,
            weight: 2,
            fillColor: '#00ffcc',
            fillOpacity: 0.8
        }).addTo(map);
        baseAnchor.bindPopup("<b>NODE WLT-LAND-OK-5111</b><br>Muskogee, OK").openPopup();

        let flightMarkers = {};
        const teleprinterStream = document.getElementById('ticker-box');

        async function fetchMuskogeeAirspace() {
            try {
                // Fetch flights within a 1-degree coordinate box around Muskogee County
                const response = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://opensky-network.org/api/states/all?lamin=33.5&lamax=37.0&lomin=-98.5&lomax=-94.0'));
                if (!response.ok) return;
                const data = await response.json();
                
                if (data && data.states) {
                    teleprinterStream.innerHTML = ''; // Clear stream in volatile memory
                    
                    data.states.forEach(aircraft => {
                        const id = aircraft[0]; // Unique ICAO transponder hash
                        const callsign = aircraft[1] ? aircraft[1].trim() : 'N/A';
                        const longitude = aircraft[5]; // Array index for longitude
                        const latitude = aircraft[6];  // Array index for latitude
                        const altitude = aircraft[7] ? Math.round(aircraft[7] * 3.28084) + ' ft' : 'GROUND';
                        const speed = aircraft[9] ? Math.round(aircraft[9] * 1.94384) + ' knots' : '0 kts';
                        
                        if (latitude && longitude) {
                            // Update or generate marker position on map canvas
                            if (flightMarkers[id]) {
                                flightMarkers[id].setLatLng([latitude, longitude]);
                            } else {
                                flightMarkers[id] = L.circleMarker([latitude, longitude], {
                                    color: '#ffaa00',
                                    radius: 6,
                                    weight: 2,
                                    fillColor: '#ffaa00',
                                    fillOpacity: 0.8
                                }).addTo(map);
                            }
                            
                            flightMarkers[id].bindPopup(`<b>Callsign: ${callsign}</b><br>Alt: ${altitude}<br>Spd: ${speed}`);
                            
                            // Stream data directly down the terminal panel
                            const logLine = document.createElement('div');
                            logLine.className = 'flight-line';
                            logLine.innerHTML = `> ICAO: <span>${id.toUpperCase()}</span> | CALL: <span>${callsign}</span><br>ALT: ${altitude} | SPD: ${speed}`;
                            teleprinterStream.appendChild(logLine);
                        }
                    });
                } else {
                    teleprinterStream.innerHTML = '<div class="flight-line">> Airspace Clear // Monitoring local grid channels...</div>';
                }
            } catch (error) {
                console.log("Telemetry link re-routing...");
            }
        }

        // Fire loop immediately and cycle every 5 seconds
        fetchMuskogeeAirspace();
        setInterval(fetchMuskogeeAirspace, 5000);
    </script>
</body>
</html>
