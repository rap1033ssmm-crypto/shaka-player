<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMKO TELEMETRY COCKPIT // MUSKOGEE COUNTY TERMINAL</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0a0c; color: #00ffcc; font-family: 'Courier New', monospace; height: 100vh; overflow: hidden; display: flex; }
#radar-container {
  flex: 1;
  height: 100vh;
  width: 100%;
  position: relative;
    filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
  z-index: 1;
}

#teleprinter-panel { width: 380px; height: 100%; background: #111115; border-left: 2px solid #22222b; display: flex; flex-direction: column; }
#header { padding: 15px; border-bottom: 2px solid #22222b; background: #0e0e12; }
#header h1 { font-size: 16px; letter-spacing: 1px; color: #fff; text-transform: uppercase; }
#header p { font-size: 11px; color: #888; margin-top: 4px; }
#ticker-box { flex: 1; overflow-y: auto; padding: 15px; font-size: 12px; line-height: 1.6; }
.flight-line { border-bottom: 1px solid #1c1c24; padding: 6px 0; display: flex; flex-direction: column; }
.flight-line span { color: #ffaa00; }

</style>
</head>
<body>
<div id="radar-container"></div>
<div id="teleprinter-panel">
<div id="header">
<h1>KMKO Systems Monitor</h1>
<p>Node WLT-LAND-OK-5111 // Muskogee County</p>
</div>
<div id="ticker-box">
<div class="flight-line">> System Initialized... Establishing Telemetry Streams...</div>
</div>
</div>
<script>
const map = L.map('radar-container', {
zoomControl: false,
attributionControl: false
}).setView([37.0000, -97.0000], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
maxZoom: 19
}).addTo(map);
const baseAnchor = L.circleMarker([37.0000, -97.0000], {
color: '#00ffcc',
radius: 8,
weight: 2,
fillColor: '#00ffcc',
fillOpacity: 0.8
}).addTo(map);
baseAnchor.bindPopup("<b>REGIONAL SYSTEM NODE</b><br>OK-KS Border Area").openPopup();
  const profileNode1 = L.circleMarker([35.6132, -95.3858], {
  color: '#00ffcc', radius: 10, weight: 3, fillColor: '#00ffcc', fillOpacity: 0.8
}).addTo(map);
profileNode1.bindPopup("<b>ALL AROUND THE WORLD WITH THEMR</b><br><span style='color:#888;'>NODE 01: MUSKOGEE OK HQ</span><br><br><audio controls style='width:160px;height:24px;'></audio><br><br><a href='https://share.google/rYXZX2uRy4GZ31rA3' target='_blank' style='display:inline-block;background:#00ffcc;color:#000;text-decoration:none;font-weight:bold;font-size:10px;padding:5px 8px;border-radius:2px;letter-spacing:1px;'>LAUNCH CORE LINK</a>");

const profileNode2 = L.circleMarker([35.6500, -95.3000], {
  color: '#ffaa00', radius: 10, weight: 3, fillColor: '#ffaa00', fillOpacity: 0.8
}).addTo(map);
profileNode2.bindPopup("<b>ALL AROUND THE WORLD WITH THEMR</b><br><span style='color:#888;'>NODE 02: EXPANSION LANES</span><br><br><audio controls style='width:160px;height:24px;'></audio><br><br><a href='https://share.google/GI9SekPEhRyZDMEdz' target='_blank' style='display:inline-block;background:#ffaa00;color:#000;text-decoration:none;font-weight:bold;font-size:10px;padding:5px 8px;border-radius:2px;letter-spacing:1px;'>LAUNCH CORE LINK</a>");

const starlinkFleet = L.layerGroup().addTo(map);
const weatherAlerts = L.layerGroup().addTo(map);
const powerOutages = L.layerGroup().addTo(map);
 const globalAirspace = L.layerGroup().addTo(map); 

const starlinkPositions = [
  { id: "SL-501", lat: 38.2, lng: -96.5 },
  { id: "SL-502", lat: 36.8, lng: -94.8 },
  { id: "SL-503", lat: 37.5, lng: -98.1 }
];
  const teleprinterStream = document.getElementById('ticker-box');
let currentAngle = 0;
  let networkThrottleCounter = 0;
  
const cargoPlane = L.circleMarker([37.5000, -96.5000], {
  color: '#ffaa00',
  radius: 6,
  weight: 2,
  fillColor: '#ffaa00',
  fillOpacity: 0.9
}).addTo(map);
cargoPlane.bindPopup("<b>LOGISTICS ASSET: BC-014</b><br>Sector Transit Active");

const issTracker = L.circleMarker([37.0000, -95.0000], {
  color: '#ff0055',
  radius: 8,
  weight: 2,
  fillColor: '#ff0055',
  fillOpacity: 1
}).addTo(map);
issTracker.bindPopup("<b>LIVE SATELLITE: ISS</b><br>Fetching orbital coordinates...");

  function runSystemDiagnostics() {
try {
const timestamp = new Date().toLocaleTimeString();
teleprinterStream.innerHTML = '';
currentAngle += 0.05;


const newLat = 37.5000 + Math.sin(currentAngle) * 0.4;
const newLng = -96.5000 + Math.cos(currentAngle) * 0.4;
cargoPlane.setLatLng([newLat, newLng]);

const issLat = 37.0000 + Math.cos(currentAngle * 0.5) * 0.8;
const issLng = -95.0000 + Math.sin(currentAngle * 0.5) * 0.8;
issTracker.setLatLng([issLat, issLng]);
fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson')
  .then(res => res.json())
  .then(data => {
    data.features.forEach(quake => {
      const coords = quake.geometry.coordinates;
      const mag = quake.properties.mag;
      const place = quake.properties.place;
      if (coords && coords.length >= 2) {
        L.circle([coords[1], coords[0]], {
          color: '#ff3333',
          radius: mag * 25000,
          weight: 2,
          fillColor: '#ff3333',
          fillOpacity: 0.4
        }).addTo(map).bindPopup("<b>HAZARD DETECTED</b><br>Mag: " + mag + "<br>" + place);
      }
    });
  }).catch(e => {});
  starlinkFleet.clearLayers();
starlinkPositions.forEach(sat => {
  sat.lat += Math.sin(currentAngle * 0.1) * 0.01;
  sat.lng += Math.cos(currentAngle * 0.1) * 0.01;
  L.circleMarker([sat.lat, sat.lng], {
    color: '#00bfff', radius: 4, weight: 1, fillColor: '#00bfff', fillOpacity: 0.8
  }).addTo(starlinkFleet).bindPopup("<b>STARLINK SATELLITE</b><br>ID: " + sat.id);
});

weatherAlerts.clearLayers();
fetch('https://weather.gov')
  .then(res => res.json())
  .then(data => {
    if (data.features) {
      data.features.slice(0, 10).forEach(alert => {
        if (alert.geometry && alert.geometry.type === "Point") {
          const wCoords = alert.geometry.coordinates;
          L.circle([wCoords[1], wCoords[0]], {
            color: '#ffaa00', radius: 30000, weight: 2, fillColor: '#ffaa00', fillOpacity: 0.2
          }).addTo(weatherAlerts).bindPopup("<b>WEATHER ALERT</b><br>" + alert.properties.event + "<br>" + alert.properties.areaDesc);
        }
      });
    }
  }).catch(e => {});


  issTracker.getPopup().setContent("<b>SATELLITE TRK: ISS</b><br>Lat: " + issLat.toFixed(4) + "<br>Lng: " + issLng.toFixed(4));

  const logs = [
`> SYS_TIME: <span>${timestamp}</span>`,
`> REGION_CTR: <span>37.0000° N</span> | <span>97.0000° W</span>`,
`> REGIONAL_RESOURCES: <span>Active & Tracking</span>`,
`> DATA_STREAM_A: <span>ONLINE // 0% Decay</span>`
];
logs.forEach(text => {
const logLine = document.createElement('div');
logLine.className = 'flight-line';
logLine.innerHTML = text;
teleprinterStream.appendChild(logLine);
});
} catch (error) { console.log("Sync delay..."); }
}
runSystemDiagnostics();
setInterval(runSystemDiagnostics, 1000);
</script>
</body>
</html>
