    gainNode.connect(audioCtx.destination);
    
    oscillator.start();
    oscillator.stop(audioCtx.currentTime + 0.15);

        ];

          // Broad circular orbits that stretch completely across the water matrices
          const swmLat = lane.baseLat + Math.sin(oceanTheta + index) * 12.0;
          const swmLon = lane.baseLon + Math.cos(oceanTheta + index) * 18.0;

          L.circleMarker([swmLat, swmLon], {
            color: '#39ff14', // High-visibility cyber-green moving trackers
            radius: 4,
            weight: 1,
            fillColor: '#39ff14',
            fillOpacity: 0.85
          }).addTo(oceanSwarmGroup).bindPopup(`
            <div style="font-family: monospace; font-size: 11px; color: #39ff14;">
              <b>TRANS-OCEANIC VECTOR: ${lane.name}</b><br>
UPLINK BEACON: INTER-CONDUIT SATELLITE SWARM

COMPLIANCE CLASSIFICATION: ISSN 3143-9756

`);
});
requestAnimationFrame(runOceanSwarmLogistics);
}
runOceanSwarmLogistics();
})();
</script>
