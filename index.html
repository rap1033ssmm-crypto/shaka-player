<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMKO TELEMETRY COCKPIT // MUSKOGEE COUNTY TERMINAL</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0a0c; color: #00ffcc; font-family: 'Courier New', monospace; height: 100vh; overflow: hidden; display: flex; }
#radar-container {
  flex: 1;
  height: 100vh;
  width: 100%;
  position: relative;
  z-index: 1;
}

#teleprinter-panel { width: 380px; height: 100%; background: #111115; border-left: 2px solid #22222b; display: flex; flex-direction: column; }
#header { padding: 15px; border-bottom: 2px solid #22222b; background: #0e0e12; }
#header h1 { font-size: 16px; letter-spacing: 1px; color: #fff; text-transform: uppercase; }
#header p { font-size: 11px; color: #888; margin-top: 4px; }
#ticker-box { flex: 1; overflow-y: auto; padding: 15px; font-size: 12px; line-height: 1.6; }
.flight-line { border-bottom: 1px solid #1c1c24; padding: 6px 0; display: flex; flex-direction: column; }
.flight-line span { color: #ffaa00; }

</style>
</head>
<body>
<div id="radar-container"></div>
<div id="teleprinter-panel">
<div id="header">
<h1>KMKO Systems Monitor</h1>
<p>Node WLT-LAND-OK-5111 // Muskogee County</p>
</div>
<div id="ticker-box">
<div class="flight-line">> System Initialized... Establishing Telemetry Streams...</div>
</div>
</div>
<script>
const map = L.map('radar-container', {
zoomControl: false,
attributionControl: false
}).setView([37.0000, -97.0000], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
maxZoom: 19
}).addTo(map);
const baseAnchor = L.circleMarker([37.0000, -97.0000], {
color: '#00ffcc',
radius: 8,
weight: 2,
fillColor: '#00ffcc',
fillOpacity: 0.8
}).addTo(map);
baseAnchor.bindPopup("<b>REGIONAL SYSTEM NODE</b><br>OK-KS Border Area").openPopup();
const teleprinterStream = document.getElementById('ticker-box');
let currentAngle = 0;
const cargoPlane = L.circleMarker([37.5000, -96.5000], {
  color: '#ffaa00',
  radius: 6,
  weight: 2,
  fillColor: '#ffaa00',
  fillOpacity: 0.9
}).addTo(map);
cargoPlane.bindPopup("<b>LOGISTICS ASSET: BC-014</b><br>Sector Transit Active");

const issTracker = L.circleMarker([37.0000, -95.0000], {
  color: '#ff0055',
  radius: 8,
  weight: 2,
  fillColor: '#ff0055',
  fillOpacity: 1
}).addTo(map);
issTracker.bindPopup("<b>LIVE SATELLITE: ISS</b><br>Fetching orbital coordinates...");

  function runSystemDiagnostics() {
try {
const timestamp = new Date().toLocaleTimeString();
teleprinterStream.innerHTML = '';
currentAngle += 0.05;
const newLat = 37.5000 + Math.sin(currentAngle) * 0.4;
const newLng = -96.5000 + Math.cos(currentAngle) * 0.4;
cargoPlane.setLatLng([newLat, newLng]);

fetch('https://wheretheiss.at')
  .then(res => res.json())
  .then(data => {
    if (data.latitude && data.longitude) {
      issTracker.setLatLng([data.latitude, data.longitude]);
      issTracker.getPopup().setContent(`<b>LIVE SATELLITE: ISS</b><br>Lat: ${data.latitude.toFixed(4)}<br>Lng: ${data.longitude.toFixed(4)}`);
    }
  }).catch(e => {});

  const logs = [
`> SYS_TIME: <span>${timestamp}</span>`,
`> REGION_CTR: <span>37.0000° N</span> | <span>97.0000° W</span>`,
`> REGIONAL_RESOURCES: <span>Active & Tracking</span>`,
`> DATA_STREAM_A: <span>ONLINE // 0% Decay</span>`
];
logs.forEach(text => {
const logLine = document.createElement('div');
logLine.className = 'flight-line';
logLine.innerHTML = text;
teleprinterStream.appendChild(logLine);
});
} catch (error) { console.log("Sync delay..."); }
}
runSystemDiagnostics();
setInterval(runSystemDiagnostics, 1000);
</script>
</body>
</html>
